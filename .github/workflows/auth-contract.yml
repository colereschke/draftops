name: Auth Provider Contract

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  discord:
    name: Discord OAuth metadata matches provider config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm-node
        with:
          install-args: --ignore-scripts

      - name: Check Discord OAuth metadata
        run: pnpm auth:check-discord
